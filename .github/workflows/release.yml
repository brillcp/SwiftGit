name: Auto Tag and Release

on:
  push:
    branches:
      - master

jobs:
  tag_and_release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get_tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Bump version (custom minor/patch logic)
        id: bump
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "${{ steps.get_tag.outputs.tag }}"

          if [ "$PATCH" -lt 9 ]; then
            PATCH=$((PATCH + 1))
          else
            MINOR=$((MINOR + 1))
            PATCH=0
          fi

          NEW_TAG="$MAJOR.$MINOR.$PATCH"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          git tag ${{ steps.bump.outputs.new_tag }}
          git push origin ${{ steps.bump.outputs.new_tag }}

      - name: Delete old tags (keep latest two)
        run: |
          # After creating the new tag, we have: old_old, old (previous latest), new (just created)
          # We want to keep only the latest two (old + new), so delete old_old
          ALL_TAGS=$(git tag --sort=-v:refname)
          COUNT=0
          for TAG in $ALL_TAGS; do
            COUNT=$((COUNT + 1))
            if [ "$COUNT" -gt 2 ]; then
              echo "Deleting old tag: $TAG"
              git push origin --delete "$TAG" 2>/dev/null || true
              git tag -d "$TAG" 2>/dev/null || true
            fi
          done

      - name: Delete old releases (keep latest two)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --json tagName -q '.[].tagName' | tail -n +3 | while read -r TAG; do
            echo "Deleting release: $TAG"
            gh release delete "$TAG" --yes 2>/dev/null || true
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          name: Release ${{ steps.bump.outputs.new_tag }}
          generate_release_notes: true
